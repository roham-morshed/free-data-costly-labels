[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tscfree"
version = "0.1.0"
description = "Free Data, Costly Labels: when does unlabeled data help time-series classification with random convolutional kernels?"
requires-python = ">=3.10"
dependencies = [
    "aeon==1.5.0",
    "scikit-learn>=1.5",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "joblib",
    "numba",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
deep = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
